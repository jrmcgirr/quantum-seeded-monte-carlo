[project]
name = "quantum-seeded-monte-carlo"
version = "0.1.0"
description = "Quantum-seeded, bit-reproducible serverless Monte Carlo pricing on AWS"
requires-python = ">=3.13,<3.14"
# Lambda supplies boto3 to the API; the worker vendors NumPy from requirements/worker.txt.
dependencies = []

[dependency-groups]
dev = [
    "boto3",
    "botocore",
    "hypothesis",
    "moto[dynamodb,sqs,ssm]>=5.1",
    # Same pin as requirements/worker.txt (HANDOFF §12).
    "numpy==2.5.4",
    "pytest",
    "pytest-cov",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qmc_core", "src/qmc_api", "src/qmc_worker"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "deployed: runs against the live stack (needs AWS credentials and make outputs)",
    "lambda_image: runs only inside public.ecr.aws/lambda/python:3.13 (make test-golden, CI golden job)",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# S0, K and T are the finance names used throughout HANDOFF.
"**" = ["N803", "N806"]
