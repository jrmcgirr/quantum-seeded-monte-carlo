# CI (QMC-106). Mirrored job for job in .github/workflows/ci.yml (D19). No deploys from CI.
stages: [lint, test, infra, security]

# One pipeline per push: branch pipelines only (merge-request pipelines would duplicate them).
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - when: always

variables:
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  # Pinned for the NumPy in requirements/worker.txt (HANDOFF §12, QMC-099).
  NPY_DISABLE_CPU_FEATURES: "X86_V4 AVX512_ICL AVX512_SPR"

# Every job has needs: [] so all start at once: stages only order the UI, and a failing test no
# longer skips the infra jobs.
default:
  interruptible: true

.uv:
  image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim
  cache:
    key: { files: [uv.lock] }
    paths: [.uv-cache]
  before_script:
    - uv sync --frozen

.has_infra:
  rules:
    - exists: ["infra/**/*.tf"]

lint:
  needs: []
  extends: .uv
  stage: lint
  script:
    - uv run ruff check .
    - uv run ruff format --check .

ssm-data-source-guard:
  needs: []
  stage: lint
  image: alpine:3.22
  script:
    # I6 / R10: a data "aws_ssm_parameter" would write the decrypted token into state.
    - if [ -d infra ] && grep -rnE 'data\s+"aws_ssm_parameter"' infra/; then echo 'data "aws_ssm_parameter" is banned (HANDOFF §8.1)'; exit 1; fi

unit:
  needs: []
  extends: .uv
  stage: test
  script:
    - uv run pytest -m "not deployed and not lambda_image" --cov --cov-report=term --cov-report=xml:coverage.xml --cov-fail-under=80 --junitxml=junit.xml
    # qmc_core gate (>= 90%) from the same run's coverage data, not a second pytest run.
    - uv run coverage report --include='src/qmc_core/*' --fail-under=90
  coverage: '/TOTAL.*\s(\d+(?:\.\d+)?)%/'
  artifacts:
    when: always
    reports:
      junit: junit.xml
      coverage_report: { coverage_format: cobertura, path: coverage.xml }

golden:
  needs: []
  stage: test
  image:
    name: public.ecr.aws/lambda/python:3.13
    entrypoint: [""]
    # x86_64 even on an Apple-silicon runner (Rosetta/QEMU): the golden hash is an x86_64 result.
    docker:
      platform: linux/amd64
  variables:
    QMC_ENFORCE_PINNED_DISPATCH: "true"
    PYTHONDONTWRITEBYTECODE: "1"
  script:
    - pip install -q --no-compile --target /tmp/deps --require-hashes -r requirements/worker.txt
    - pip install -q --no-compile --target /tmp/deps pytest hypothesis "moto[dynamodb,sqs,ssm]"
    - PYTHONPATH=/tmp/deps:src:. python -m pytest -p no:cacheprovider -m lambda_image -v --junitxml=golden.xml
  artifacts:
    when: always
    reports: { junit: golden.xml }

terraform:
  needs: []
  extends: .has_infra
  stage: infra
  image: { name: "hashicorp/terraform:1.16.5", entrypoint: [""] }
  script:
    - terraform fmt -check -recursive infra
    - terraform -chdir=infra init -backend=false -input=false
    - terraform -chdir=infra validate

tflint:
  needs: []
  extends: .has_infra
  stage: infra
  image: { name: "ghcr.io/terraform-linters/tflint:v0.64.0", entrypoint: [""] }
  variables:
    # Cached so --init does not hit GitHub's anonymous API limit (60/h per IP) on every run.
    TFLINT_PLUGIN_DIR: "$CI_PROJECT_DIR/.tflint.d/plugins"
  cache:
    key: { files: [infra/.tflint.hcl] }
    paths: [.tflint.d/]
  script:
    - tflint --chdir=infra --init
    - tflint --chdir=infra --recursive

checkov:
  needs: []
  extends: .has_infra
  stage: security
  image: { name: "bridgecrew/checkov:3.3.28", entrypoint: [""] }
  allow_failure: true # until QMC-119
  script:
    - checkov -d infra --quiet --compact
